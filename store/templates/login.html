{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">Sign In to Lenskart</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Email or Mobile Number</label>
            <input type="text" name="username" class="form-control" required placeholder="Enter email or mobile">
        </div>
        <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Password</label>
            <input type="password" name="password" class="form-control" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <span style="color: #666;">New to Lenskart?</span> <a href="{% url 'register' %}" style="color: var(--secondary-color); font-weight: 600; text-decoration: none;">Create an account</a>
    </div>
</div>
{% endblock %}
