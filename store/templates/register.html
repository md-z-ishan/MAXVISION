{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">Create an Account</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">First Name</label>
            <input type="text" name="name" class="form-control" required placeholder="Enter first name">
        </div>
        <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Mobile Number *</label>
            <input type="text" name="mobile" class="form-control" required placeholder="Enter 10-digit mobile">
        </div>
        <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="Enter email (optional)">
        </div>
        <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Username *</label>
            <input type="text" name="username" class="form-control" required placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Password *</label>
            <input type="password" name="password" class="form-control" required placeholder="Choose a password">
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Create Account</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <span style="color: #666;">Already have an account?</span> <a href="{% url 'login' %}" style="color: var(--secondary-color); font-weight: 600; text-decoration: none;">Sign In</a>
    </div>
</div>
{% endblock %}
